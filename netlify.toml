# Publish only the site folder so planning docs, PDFs and other repo files
# are never served from mathwithhenry.com.
[build]
  publish = "public"
  # Writes public/version.json (commit, branch, context, deploy id, build time)
  # so a deploy can be verified at /version.json. No dependencies.
  command = "node scripts/write-version.mjs"

# Long-lived caching for static images (filenames change if the image does).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serverless functions: /api/content (public read) and /api/admin (password-protected write).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Never cache or index the admin page.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Build stamp for deploy verification: always fetch fresh.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
